name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          gh auth setup-git
          commits="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$HEAD_SHA" --jq .total_commits)"
          git fetch --no-tags --depth="$((commits + 1))" origin "$HEAD_SHA"
          vp exec commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
      - run: vp run verify
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  jev-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jev-lint/baseline.json
          key: jev-lint-${{ github.sha }}
          restore-keys: jev-lint-
      - id: jev-lint
        run: vp exec jev-lint check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: always() && steps.jev-lint.outcome != 'skipped'
        run: vp exec jev-lint check --config .jev-lint.decider.yaml
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: always() && steps.jev-lint.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jev-lint/baseline.json
          key: jev-lint-${{ github.sha }}

  autofix:
    needs: verify
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: verify-autofix-${{ github.ref_name }}
    env:
      GH_TOKEN: ${{ github.token }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HEAD_BRANCH: ${{ github.ref_name }}
      HEAD_SHA: ${{ github.sha }}
      FAILED_RUN_ID: ${{ github.run_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      FAILED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - id: target
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HEAD_BRANCH" = "$DEFAULT_BRANCH" ]; then
            branch="claude/fix-verify-$FAILED_RUN_ID"
            git switch -c "$branch"
          else
            branch="$HEAD_BRANCH"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "failed_job=$(gh run view "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.name == "verify") | .databaseId')" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - if: steps.target.outputs.stale != 'true'
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - if: steps.target.outputs.stale != 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - if: steps.target.outputs.stale != 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: renovate
          prompt: |
            The verify job failed on branch ${{ github.ref_name }} (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            The working tree is checked out on branch ${{ steps.target.outputs.branch }}.

            1. Read the failure with `gh run view --job ${{ steps.target.outputs.failed_job }} --log-failed`.
            2. Fix the root cause in the code, following AGENTS.md. Do not weaken lint rules, add disable directives, or skip checks to make verify pass.
            3. Run `vp run verify` and repeat until it passes.
            4. Commit the fix with a Conventional Commits message whose body explains the cause. Do not push.
          claude_args: >-
            --max-turns 200
            --model claude-opus-5-5
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash"
      - if: steps.target.outputs.stale != 'true'
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then
            echo "::error::Claude did not commit a fix"
            exit 1
          fi
          gh auth setup-git
          git push --no-verify origin "HEAD:refs/heads/$BRANCH"
          if [ "$BRANCH" != "$HEAD_BRANCH" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" --draft \
              --title "$(git log -1 --format=%s)" \
              --body "Fixes verify failure $FAILED_RUN_URL" ||
              echo "::warning::Could not open a pull request; open one from $BRANCH manually"
          fi

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.repository == 'masseater/typescript-template'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: vp exec alchemy deploy --stage production --yes
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  release:
    needs: verify
    if: github.event_name == 'push' && github.repository == 'masseater/typescript-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
